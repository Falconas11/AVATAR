name: Latency diagnostics checks

on:
  push:
    branches:
      - diagnostics/api-latency-profiling
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest
      - run: pytest -q tests/test_latency_instrumentation.py
